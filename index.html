<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10140f"><title>Monster Legacy Online</title>
<style>
:root{--gold:#d6ae63;--edge:#6d512b;--panel:#171812f2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d0a;color:#f0e5c8;font-family:Georgia,serif;touch-action:none}#game{position:relative;width:100%;height:100%;background:#142318}canvas#world{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}.panel{background:linear-gradient(135deg,#30291eeF,#11130ff5);border:2px solid #94713d;box-shadow:inset 0 0 0 2px #211b12, inset 0 0 18px #000b,0 5px 18px #000c;border-radius:5px}.hero{position:absolute;top:10px;left:10px;width:240px;padding:9px 12px}.brand{font-size:14px;letter-spacing:2px;color:#f1d18a;text-shadow:0 2px #392512}.sub{font:10px Arial;color:#c9b991;margin-top:3px}.bar{height:10px;background:#080a08;border:1px solid #6c5835;margin-top:5px;padding:1px}.fill{height:100%;background:linear-gradient(#ff7966,#9e2826);width:100%}#xp{background:linear-gradient(#ffe08b,#b27a2a);width:22%}.stats{position:absolute;right:10px;top:10px;padding:10px 13px;text-align:right;font:12px Arial;line-height:1.6;color:#f2d89d}.quest{position:absolute;right:10px;top:88px;width:180px;padding:10px;font-size:11px}.quest b{color:#f0ce86;letter-spacing:1px}.quest p{margin:6px 0;color:#d0c1a0;line-height:1.4}#minibox{position:absolute;right:10px;top:190px;width:132px;height:108px;padding:4px;display:none;background:#11170f;border:2px solid #9c7943;border-radius:4px}#mini{width:100%;height:100%;image-rendering:pixelated}.bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;background:#12130ff0;border:2px solid #896a3b;border-radius:5px}.slot{width:43px;height:43px;border:1px solid #927344;background:linear-gradient(145deg,#49402c,#15150f);display:grid;place-items:center;position:relative;color:#f5d99c;font-size:20px;box-shadow:inset 0 0 8px #000}.slot small{position:absolute;top:2px;left:4px;font:9px Arial;color:#e8c77f}.controls{position:absolute;bottom:78px;right:15px;display:flex;gap:9px;align-items:end}.orb{width:54px;height:54px;border-radius:50%;border:2px solid #c29b56;background:radial-gradient(circle at 35% 25%,#64543b,#17140e 70%);color:#fff1ce;font-size:21px;box-shadow:0 3px 10px #000b}.orb.attack{width:67px;height:67px;background:radial-gradient(circle at 35% 25%,#b64c35,#34130f 75%);font-size:27px}#joy{position:absolute;bottom:22px;left:18px;width:112px;height:112px;border:2px solid #b18b4d99;border-radius:50%;background:#11160d99;display:grid;place-items:center}#stick{width:47px;height:47px;border:2px solid #e2c17b;border-radius:50%;background:radial-gradient(circle at 35% 25%,#d5b36d,#49351d);box-shadow:0 3px 9px #000}.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#030603bb;padding:15px}.window{width:min(440px,96vw);padding:15px;max-height:80vh;overflow:auto}.window h2{margin:0 0 12px;color:#f1d18a;border-bottom:1px solid #765a31;padding-bottom:8px}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.item{height:70px;border:1px solid #896c40;background:linear-gradient(145deg,#3d3527,#10130e);display:grid;place-items:center;font-size:23px}.item small{font:10px Arial;color:#d5c39d}.btn{background:linear-gradient(#a17b40,#503519);border:1px solid #e0bc72;color:#fff0cb;padding:9px 13px;margin:8px 5px 0 0;border-radius:3px}#toast{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);padding:10px 17px;background:#17140eef;border:2px solid #c49a51;color:#ffe5a8;display:none;white-space:nowrap;font-size:13px;box-shadow:0 4px 20px #000} @media(min-width:700px){.hero{width:270px}.quest{top:88px;width:200px}#minibox{display:block}.slot{width:49px;height:49px}}
</style></head><body><div id="game"><canvas id="world"></canvas>
<div class="hero panel"><div class="brand">⚔ MONSTER LEGACY</div><div class="sub">Aventureiro · Nível <span id="level">1</span></div><div class="bar"><div class="fill" id="hpbar"></div></div><div class="bar"><div class="fill" id="xp"></div></div><div class="sub" id="hptext">100 / 100 HP</div></div>
<div class="stats panel">🪙 <b id="gold">125</b><br>⚔ <b id="atk">18</b> ATK</div>
<div class="quest panel"><b>📜 PRIMEIRA CAÇADA</b><p>Elimine as criaturas que rondam as ruínas da floresta.</p><span id="kills">Criaturas: 0 / 5</span></div><div id="minibox"><canvas id="mini"></canvas></div>
<div id="joy"><div id="stick"></div></div><div class="bottom"><div class="slot" id="potionSlot"><small>1</small>🧪</div><div class="slot"><small>2</small>⚔</div><div class="slot"><small>3</small>✦</div><div class="slot"><small>4</small>🛡</div><div class="slot" id="bag"><small>B</small>🎒</div></div>
<div class="controls"><button class="orb" id="potion">🧪</button><button class="orb attack" id="attack">⚔</button></div>
<div class="modal" id="modal"><div class="window panel"><h2 id="title">Mochila</h2><div id="content"></div><button class="btn" id="close">Fechar</button></div></div><div id="toast"></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),g=canvas.getContext('2d'),mini=document.getElementById('mini'),mctx=mini.getContext('2d');
let W=0,H=0,scale=2,camX=0,camY=0,level=1,xp=0,gold=125,hp=100,kills=0,attack=false,lastHit=0,move={x:0,y:0},monsters=[],particles=[],worldSeed=9321;
const rnd=(n)=>{let x=Math.sin(n*127.1+worldSeed)*43758.5453;return x-Math.floor(x)},clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){scale=innerWidth<600?2:2;W=Math.ceil(innerWidth/scale);H=Math.ceil(innerHeight/scale);canvas.width=W;canvas.height=H;g.imageSmoothingEnabled=false;mini.width=126;mini.height=94;camX=0;camY=0}addEventListener('resize',resize);resize();
const palettes={hero:['#171d25','#344a59','#71858b','#c7b98f','#d9b978','#70402c','#b9c5c2'],goblin:['#17271c','#315437','#59804b','#91a56b','#c6b27a','#59362a'],slime:['#263d29','#4c7a42','#82b65a','#b9d77a','#e0d78c'],skeleton:['#25232a','#66605a','#aaa18b','#e0d3ae','#81503a']};
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}
function pixelSprite(type,x,y,frame=0){let p=palettes[type],rows;
if(type==='hero')rows=[
'.......44444.......','......4444444......','......3333333......','......2222222......','.......1111........','......122221.......','.....12222221......','....5552222255.....','....5552222255.....','.....6666666.......','......66666........','.....666.666.......','....666...666.......','...5555...5555......','...5555...5555......','....111...111.......','....111...111.......','...1111...1111......'];
if(type==='goblin')rows=['......33333......','.....3333333.....','....222222222....','...22222222222...','..222.11111.222..','..22..1.1.1..22..','..2222222222222..','...22222222222...','....111111111....','...11122222111...','..1111222221111..','..111.22222.111..','.....222.222......','....1111.1111.....'];
if(type==='slime')rows=['......3333......','....33333333....','..222222222222..','.22222222222222.','2222222222222222','2222222222222222','222.111.222.1112','222.111.222.1112','2222222222222222','.22222222222222.','..111111111111..','....11111111....'];
if(type==='skeleton')rows=['......3333......','.....333333.....','.....3.1.3......','.....333333.....','......2222......','.....222222.....','....222222222....','....222.22222....','......22222......','......11111......','.....111.111......','.....111.111......','....1111.1111.....'];
let h=rows.length,w=rows[0].length,px=x-Math.floor(w/2),py=y-h+3;
for(let j=0;j<h;j++)for(let i=0;i<w;i++){let ch=rows[j][i];if(ch==='.')continue;let col=p[Number(ch)-1]||p[0];rect(px+i,py+j,1,1,col)}
// pixel highlights and gear
if(type==='hero'){rect(x-4,y-14,2,2,'#f4e4bd');rect(x+2,y-14,2,2,'#f4e4bd');rect(x+5,y-9,2,5,'#d5b36d');rect(x+6,y-16,1,9,'#e3e5d8');rect(x-6,y-3,3,4,'#d7b56b')}
else if(type==='goblin'){rect(x-4,y-9,2,2,'#f4d77b');rect(x+2,y-9,2,2,'#f4d77b')}
else if(type==='skeleton'){rect(x-4,y-12,2,2,'#e7d28b');rect(x+2,y-12,2,2,'#e7d28b')}
}
function tree(x,y,variant=0){ // layered pixel-art oak canopy
rect(x-2,y-9,4,11,'#49301d');rect(x-1,y-8,2,8,'#88603a');
let layers=variant?[[0,-19,9],[0,-25,7],[-6,-20,6],[6,-20,6]]:[[0,-19,10],[-7,-17,7],[7,-17,7],[0,-26,7],[-4,-29,4]];
for(let k=0;k<layers.length;k++){let [dx,dy,r]=layers[k];rect(x+dx-r,y+dy-r/2,r*2,r,'#172c20');rect(x+dx-r+1,y+dy-r/2+1,r*2-2,r-2,k%2?'#31583a':'#3e6b43');rect(x+dx-r+2,y+dy-r/2+1,Math.max(2,r-2),2,'#789052');rect(x+dx+2,y+dy+1,Math.max(2,r-4),2,'#24462f')}
rect(x-6,y-23,3,2,'#789252');rect(x+3,y-28,3,2,'#91a05a');
}
function rock(x,y){rect(x-6,y-3,12,5,'#222b26');rect(x-5,y-5,9,5,'#59635a');rect(x-2,y-7,5,3,'#778074');rect(x-4,y-4,3,1,'#a1a18a')}
function tile(tx,ty){let v=rnd(tx*51+ty*93),x=tx*16-camX,y=ty*16-camY;let base=v>.55?'#354d34':v>.2?'#304831':'#2c442f';rect(x,y,16,16,base);let flecks=Math.floor(rnd(tx*19-ty*7)*4)+1;for(let i=0;i<flecks;i++){let fx=x+Math.floor(rnd(tx*33+i+ty)*15),fy=y+Math.floor(rnd(ty*71+i+tx)*15);rect(fx,fy,1,1,i%2?'#526746':'#253c2b')}if(rnd(tx*7+ty*13)>.88){rect(x+5,y+7,1,2,'#b4a65f');rect(x+7,y+8,1,1,'#d0bd74')}if(rnd(tx*31+ty*3)>.94)rock(x+8,y+10)}
function pathTile(x,y){rect(x,y,16,16,'#65543a');rect(x+1,y+1,14,14,'#796544');for(let i=0;i<5;i++)rect(x+Math.floor(rnd(x+i)*14),y+Math.floor(rnd(y-i)*14),2,1,'#9a8155')}
function drawWorld(){g.clearRect(0,0,W,H);let sx=Math.floor(camX/16),sy=Math.floor(camY/16);for(let ty=sy-1;ty<sy+H/16+2;ty++)for(let tx=sx-1;tx<sx+W/16+2;tx++){let x=tx*16-camX,y=ty*16-camY;if(Math.abs(tx*16)<44||Math.abs(ty*16)<35)pathTile(x,y);else tile(tx,ty)}
// decorative ruins and woodland objects, deterministic
for(let i=0;i<125;i++){let wx=(Math.floor(rnd(i*3)*90)-45)*16,wy=(Math.floor(rnd(i*7+1)*70)-35)*16,x=wx-camX,y=wy-camY;if(x<-35||x>W+35||y<-45||y>H+30)continue;let v=rnd(i*11);if(v>.22)tree(x,y,i%3===0);else rock(x,y)}
// mossy stone circle landmarks
for(let k=0;k<4;k++){let x=(k%2?210:-210)-camX,y=(k<2?-130:160)-camY;for(let i=0;i<5;i++){rect(x+i*8-18,y,7,5,'#465348');rect(x+i*8-17,y-2,5,3,'#7c826e');rect(x+i*8-16,y-2,2,1,'#a0a184')}}
for(const m of monsters){let x=m.x-camX,y=m.y-camY;if(x<-30||x>W+30||y<-30||y>H+30)continue;rect(x-10,y+1,20,4,'#182019');pixelSprite(m.type,x,y,m.phase);rect(x-10,y-18,20,3,'#151512');rect(x-9,y-17,18*m.hp/m.max,1,'#c24d40');rect(x-10,y-18,20,1,'#d1b77a')}
let hx=W/2,hy=H/2;rect(hx-8,hy+1,16,4,'#19221a');pixelSprite('hero',hx,hy);if(attack){g.strokeStyle='#ffe08a';g.lineWidth=2;g.beginPath();g.arc(hx,hy-5,17,Math.PI*1.1,Math.PI*1.9);g.stroke()}
for(let p of particles){rect(p.x-camX,p.y-camY,2,2,p.color)}
drawMini()}
function drawMini(){mctx.fillStyle='#263e2b';mctx.fillRect(0,0,126,94);for(let i=0;i<38;i++){let x=rnd(i*8)*126,y=rnd(i*13+2)*94;mctx.fillStyle='#496441';mctx.fillRect(x,y,3,3)}mctx.fillStyle='#d8b86c';mctx.fillRect(61,45,4,4);mctx.fillStyle='#cf6750';for(let m of monsters){let x=63+(m.x-camX)/9,y=47+(m.y-camY)/9;if(x>0&&x<126&&y>0&&y<94)mctx.fillRect(x,y,2,2)}}
function spawn(){monsters=[];for(let i=0;i<12;i++)monsters.push({x:Math.round((rnd(i*9)-.5)*500),y:Math.round((rnd(i*17+3)-.5)*420),hp:42,max:42,type:['goblin','slime','skeleton'][i%3],phase:rnd(i+1)})}spawn();
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',1700)}
function updateUI(){document.getElementById('gold').textContent=gold;document.getElementById('level').textContent=level;document.getElementById('hpbar').style.width=hp+'%';document.getElementById('hptext').textContent=hp+' / 100 HP';document.getElementById('xp').style.width=(xp/100*100)+'%';document.getElementById('kills').textContent='Criaturas: '+Math.min(kills,5)+' / 5';document.getElementById('atk').textContent=18+(level-1)*4}
function hit(){let m=monsters.find(q=>Math.hypot(q.x-camX,q.y-camY)<36);if(!m){toast('Aproxime-se de uma criatura');return}m.hp-=18+(level-1)*4;for(let i=0;i<8;i++)particles.push({x:m.x,y:m.y-8,color:i%2?'#f2c66c':'#e56d45',life:20});if(m.hp<=0){monsters=monsters.filter(q=>q!==m);kills++;gold+=15;xp+=30;if(xp>=100){xp-=100;level++;hp=100;toast('Nível '+level+' alcançado!')}else toast('Criatura derrotada · +15 ouro');if(monsters.length<8)for(let i=0;i<5;i++)monsters.push({x:camX+(rnd(i+Date.now()%100)*500-250),y:camY+(rnd(i+9+Date.now()%100)*400-200),hp:42,max:42,type:['goblin','slime','skeleton'][i%3]});if(kills===5){gold+=100;toast('Missão concluída! +100 ouro')}}else toast('Acerto!');updateUI()}
let prev=0;function frame(t){let dt=Math.min(.04,(t-prev)/1000||0);prev=t;camX+=move.x*90*dt;camY+=move.y*90*dt;if(attack&&t-lastHit>650){lastHit=t;hit()}for(let p of particles)p.life--;particles=particles.filter(p=>p.life>0);drawWorld();requestAnimationFrame(frame)}requestAnimationFrame(frame);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),k=Math.min(1,42/(d||1));move={x:dx*k/42,y:dy*k/42};stick.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=e=>{if(e.buttons)joyMove(e)};joy.onpointerup=joy.onpointercancel=()=>{move={x:0,y:0};stick.style.transform=''};
document.getElementById('attack').onpointerdown=()=>attack=true;document.getElementById('attack').onpointerup=document.getElementById('attack').onpointerleave=()=>attack=false;
function potion(){hp=Math.min(100,hp+35);updateUI();toast('Poção utilizada')}document.getElementById('potion').onclick=potion;document.getElementById('potionSlot').onclick=potion;
function menu(){document.getElementById('modal').style.display='flex';document.getElementById('title').textContent='Mochila e equipamentos';document.getElementById('content').innerHTML='<div class="items">'+[['⚔','Espada de aço'],['🛡','Escudo antigo'],['🧪','Poção'],['💎','Gema'],['🪙',gold+' ouro'],['📜','Caçada'],['🥾','Botas'],['🧥','Armadura']].map(a=>'<div class="item">'+a[0]+'<small>'+a[1]+'</small></div>').join('')+'</div><p style="font:12px Arial;color:#cdbd9a">Loja da vila · Aprimore seu equipamento.</p><button class="btn" id="buy">Comprar poção reforçada · 50 ouro</button>';document.getElementById('buy').onclick=()=>{if(gold>=50){gold-=50;hp=100;updateUI();toast('Poção reforçada comprada')}else toast('Ouro insuficiente')}}document.getElementById('bag').onclick=menu;document.getElementById('close').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.style.display='none'};
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')move.y=-1;if(k==='s'||k==='arrowdown')move.y=1;if(k==='a'||k==='arrowleft')move.x=-1;if(k==='d'||k==='arrowright')move.x=1;if(k===' ')attack=true;if(k==='b')menu()});addEventListener('keyup',e=>{if(e.key===' ')attack=false;if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))move={x:0,y:0}});
updateUI();
})();</script></div></body></html>
