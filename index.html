<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10100f"><title>Monster Legacy Online</title>
<style>
:root{--gold:#c99b45;--gold2:#f1d18a;--panel:#171714ee;--line:#705329;--red:#b83d36;--green:#55965c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c0a;color:#eee;font-family:Georgia,serif;touch-action:none}#game{position:relative;width:100%;height:100%;background:radial-gradient(ellipse at center,#304a32 0%,#111a14 100%)}canvas{width:100%;height:100%;display:block;image-rendering:auto}
.panel{background:linear-gradient(145deg,#30291fF5 0%,#171611f8 48%,#0d100df7 100%);border:1px solid #9b773d;box-shadow:inset 0 0 0 1px #f0d18a25,inset 0 0 18px #0009,0 6px 22px #000c;border-radius:7px}.frame{border:1px solid #a98545;border-radius:5px;box-shadow:inset 0 0 0 2px #261e12,0 0 0 1px #000}
#top{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hero{padding:8px 11px;width:min(280px,58vw)}.hero b{color:var(--gold2);font-size:14px;letter-spacing:1px}.small{font:11px Arial;color:#c8bda7}.bar{height:9px;background:#090909;border:1px solid #574a34;margin-top:5px;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(#e55b50,#8d211e)}#xp{background:linear-gradient(#f0ca66,#99702b);width:18%}.stats{padding:9px 12px;text-align:right;font:12px Arial;color:#e7d7b8;min-width:105px}
#quest{position:absolute;top:100px;right:10px;width:190px;padding:10px;font-size:12px;color:#e7d5af}#quest strong{color:var(--gold2);letter-spacing:1px}#quest p{margin:6px 0;color:#c7b99d;line-height:1.35}
#mapbox{position:absolute;top:10px;right:10px;width:126px;height:112px;padding:5px;background:#14140f;border:2px solid #876735;border-radius:5px;display:none}#minimap{width:100%;height:100%}
#hotbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;background:#14130fe8;border:1px solid #8e6a35;border-radius:7px}.slot{width:43px;height:43px;border:1px solid #80643a;background:linear-gradient(145deg,#3b3325,#111);border-radius:4px;display:grid;place-items:center;position:relative;font-size:23px;text-shadow:0 2px 4px #000}.slot small{position:absolute;top:2px;left:4px;font:9px Arial;color:#e4ca8e}
#actions{position:absolute;bottom:78px;right:14px;display:flex;gap:9px;align-items:end}.orb{width:55px;height:55px;border-radius:50%;border:2px solid #b58a45;background:radial-gradient(circle at 35% 25%,#665338,#17130e 68%);box-shadow:0 3px 10px #000b,inset 0 0 0 2px #302315;color:#fff;font-size:22px}.orb.attack{width:66px;height:66px;background:radial-gradient(circle at 35% 25%,#a33e31,#35100e 72%);font-size:26px}.orb:active,.slot:active{filter:brightness(1.5)}
#joystick{position:absolute;bottom:24px;left:18px;width:112px;height:112px;border:2px solid #b58b4a88;border-radius:50%;background:#15130d88;display:grid;place-items:center}#stick{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#c8a35c,#443019);border:2px solid #e2c17b;box-shadow:0 3px 8px #000}
#menu{position:absolute;inset:0;background:#050605b8;display:none;align-items:center;justify-content:center;padding:16px}.window{width:min(480px,96vw);max-height:82vh;overflow:auto;padding:14px}.window h2{margin:0 0 12px;color:var(--gold2);font-size:20px;border-bottom:1px solid #765a31;padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.item{min-height:68px;background:linear-gradient(145deg,#373024,#111);border:1px solid #80643a;border-radius:4px;display:grid;place-items:center;color:#e8d4a9;font-size:24px}.item small{font:10px Arial;color:#b9a783}.btn{background:linear-gradient(#98733b,#4b3218);border:1px solid #d1aa62;color:#fff2d4;padding:9px 14px;border-radius:4px;font:12px Georgia;margin:7px 5px 0 0}
#toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);background:#17130ee8;border:1px solid var(--gold);padding:9px 16px;border-radius:5px;color:#ffe2a4;display:none;white-space:nowrap}
@media(min-width:700px){#quest{top:138px;width:220px}#mapbox{display:block}#joystick{width:125px;height:125px}#hotbar{bottom:16px}.slot{width:49px;height:49px}#actions{bottom:90px}}
</style></head><body><div id="game"><canvas id="world"></canvas>
<div id="top"><div class="hero panel"><b>⚔ MONSTER LEGACY</b><div class="small">Aventureiro · Nível <span id="level">1</span></div><div class="bar"><div class="fill" id="hp"></div></div><div class="bar"><div class="fill" id="xp"></div></div><div class="small" id="hptext">100 / 100 HP</div></div><div class="stats panel">🪙 <span id="gold">125</span><br><span class="small">Ouro</span><br>⚔ 12 ATK</div></div>
<div id="quest" class="panel"><strong>📜 PRIMEIRA CAÇADA</strong><p>Derrote criaturas da floresta para provar seu valor.</p><span id="kills">Criaturas: 0 / 5</span></div><div id="mapbox" class="frame"><canvas id="minimap"></canvas></div>
<div id="joystick"><div id="stick"></div></div><div id="hotbar"><div class="slot"><small>1</small>🧪</div><div class="slot"><small>2</small>🗡️</div><div class="slot"><small>3</small>🔥</div><div class="slot"><small>4</small>🛡️</div><div class="slot" id="bag"><small>B</small>🎒</div></div>
<div id="actions"><button class="orb" id="potion">🧪</button><button class="orb attack" id="attack">⚔</button></div>
<div id="menu"><div class="window panel"><h2 id="menutitle">Inventário</h2><div id="menucontent"></div><button class="btn" id="close">Fechar</button></div></div><div id="toast"></div></div>
<script>
(()=>{const c=document.getElementById('world'),ctx=c.getContext('2d'),mm=document.getElementById('minimap'),mx=mm.getContext('2d');let W=0,H=0,px=0,py=0,level=1,xp=0,gold=125,hp=100,kills=0,attackOn=false,last=0,move={x:0,y:0},monsters=[];
const rnd=(a,b)=>Math.random()*(b-a)+a;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;px=W/2;py=H/2}addEventListener('resize',resize);resize();
function spawn(){monsters=[];for(let i=0;i<13;i++)monsters.push({x:rnd(-650,650),y:rnd(-450,450),hp:35,max:35,phase:rnd(0,6),kind:i%3})}spawn();
function ground(x,y){let n=Math.sin(x*.017)*Math.cos(y*.021)+Math.sin((x+y)*.009);return n}
function drawTree(x,y,s){
ctx.save();ctx.translate(x,y);ctx.scale(s,s);
ctx.fillStyle='#090e0a66';ctx.beginPath();ctx.ellipse(3,9,22,9,0,0,7);ctx.fill();
let trunk=ctx.createLinearGradient(-5,0,6,0);trunk.addColorStop(0,'#302219');trunk.addColorStop(.5,'#89603b');trunk.addColorStop(1,'#241a14');ctx.fillStyle=trunk;ctx.beginPath();ctx.moveTo(-5,7);ctx.lineTo(-3,-27);ctx.lineTo(2,-38);ctx.lineTo(7,8);ctx.closePath();ctx.fill();
for(let i=0;i<5;i++){let yy=-23-i*7,rr=19-i*1.7;let g=ctx.createRadialGradient(-5,yy-6,2,0,yy,rr);g.addColorStop(0,['#78905a','#65814b','#496b3e'][i%3]);g.addColorStop(.65,['#355b38','#294b31','#203e2a'][i%3]);g.addColorStop(1,'#14291f');ctx.fillStyle=g;ctx.beginPath();ctx.arc((i%2?7:-5),yy,rr,0,7);ctx.fill();ctx.strokeStyle='#a4a56a55';ctx.lineWidth=1;ctx.beginPath();ctx.arc((i%2?7:-5)-2,yy-2,rr*.7,3.5,5.1);ctx.stroke()}
ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let tile=48,ox=W/2-px,oy=H/2-py;ctx.fillStyle='#263b2a';ctx.fillRect(0,0,W,H);
for(let y=-2;y<H/tile+2;y++)for(let x=-2;x<W/tile+2;x++){let wx=Math.floor((x*tile-ox)/tile),wy=Math.floor((y*tile-oy)/tile),v=ground(wx*tile,wy*tile);ctx.fillStyle=v>.35?'#385039':v<-.35?'#293e2d':'#314832';ctx.fillRect(x*tile-ox%tile,y*tile-oy%tile,tile+1,tile+1);if((wx*17+wy*31)%13===0){ctx.fillStyle='#71804b';ctx.fillRect(x*tile-ox%tile+13,y*tile-oy%tile+20,3,2)}}
for(let i=0;i<90;i++){let tx=((i*173)%1400)-700,ty=((i*97)%1000)-500,s=.7+(i%4)*.12, sx=W/2+tx-px,sy=H/2+ty-py;if(sx>-35&&sx<W+35&&sy>-40&&sy<H+40)drawTree(sx,sy,s)}
monsters.forEach(m=>{let x=W/2+m.x-px,y=H/2+m.y-py;if(x<-50||x>W+50||y<-50||y>H+50)return;
ctx.fillStyle='#080d0966';ctx.beginPath();ctx.ellipse(x,y+13,22,8,0,0,7);ctx.fill();
let body=ctx.createRadialGradient(x-6,y-8,2,x,y,22);body.addColorStop(0,m.kind===0?'#d4c78c':m.kind===1?'#b66b4d':'#9ab76c');body.addColorStop(.55,m.kind===0?'#77734d':m.kind===1?'#713e31':'#4d7545');body.addColorStop(1,'#202b20');
ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(x,y,16,19,0,0,7);ctx.fill();ctx.strokeStyle='#d8c18a88';ctx.lineWidth=1.5;ctx.stroke();
ctx.fillStyle=m.kind===1?'#d7a05c':'#d8d0a0';ctx.beginPath();ctx.arc(x-6,y-5,3,0,7);ctx.arc(x+6,y-5,3,0,7);ctx.fill();ctx.fillStyle='#26150f';ctx.beginPath();ctx.arc(x-6,y-5,1.3,0,7);ctx.arc(x+6,y-5,1.3,0,7);ctx.fill();
ctx.strokeStyle='#d0b178';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-11,y-13);ctx.lineTo(x-17,y-22);ctx.moveTo(x+11,y-13);ctx.lineTo(x+17,y-22);ctx.stroke();
ctx.fillStyle='#090909';ctx.fillRect(x-19,y-29,38,5);ctx.fillStyle='#b83d36';ctx.fillRect(x-18,y-28,36*m.hp/m.max,3);ctx.strokeStyle='#d2b16b';ctx.strokeRect(x-19,y-29,38,5);
});
let x=W/2,y=H/2;
ctx.fillStyle='#070b0877';ctx.beginPath();ctx.ellipse(x,y+17,19,8,0,0,7);ctx.fill();
let cape=ctx.createLinearGradient(x-10,y-10,x+12,y+16);cape.addColorStop(0,'#783b2c');cape.addColorStop(1,'#281b18');ctx.fillStyle=cape;ctx.beginPath();ctx.moveTo(x-9,y-8);ctx.lineTo(x+10,y-8);ctx.lineTo(x+15,y+17);ctx.lineTo(x-14,y+17);ctx.closePath();ctx.fill();
let armor=ctx.createLinearGradient(x-10,y-14,x+10,y+12);armor.addColorStop(0,'#e0d6b4');armor.addColorStop(.35,'#788b91');armor.addColorStop(.7,'#354b55');armor.addColorStop(1,'#182a32');ctx.fillStyle=armor;ctx.beginPath();ctx.moveTo(x-9,y-12);ctx.lineTo(x+9,y-12);ctx.lineTo(x+11,y+8);ctx.lineTo(x,y+14);ctx.lineTo(x-11,y+8);ctx.closePath();ctx.fill();ctx.strokeStyle='#d5b56e';ctx.lineWidth=1.5;ctx.stroke();
ctx.fillStyle='#d7b67d';ctx.beginPath();ctx.arc(x,y-19,8,0,7);ctx.fill();ctx.fillStyle='#b9c4c4';ctx.beginPath();ctx.moveTo(x-10,y-20);ctx.lineTo(x-7,y-29);ctx.lineTo(x+7,y-29);ctx.lineTo(x+10,y-20);ctx.closePath();ctx.fill();ctx.strokeStyle='#e6d29b';ctx.stroke();
ctx.fillStyle='#293e53';ctx.fillRect(x-10,y+7,8,13);ctx.fillRect(x+2,y+7,8,13);ctx.fillStyle='#a47a43';ctx.fillRect(x-11,y+17,9,4);ctx.fillRect(x+2,y+17,9,4);
ctx.strokeStyle='#d7dce0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+11,y-10);ctx.lineTo(x+20,y+12);ctx.stroke();ctx.strokeStyle='#bd9147';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+8,y-12);ctx.lineTo(x+15,y-7);ctx.stroke();
ctx.fillStyle='#a77b3c';ctx.beginPath();ctx.ellipse(x-14,y+1,7,10,-.2,0,7);ctx.fill();ctx.strokeStyle='#e1c17d';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#d7bd83';ctx.beginPath();ctx.arc(x-14,y+1,3,0,7);ctx.fill();
if(attackOn){ctx.strokeStyle='#f4d17a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,27,0,Math.PI*1.6);ctx.stroke()}
if(mm.width!==126*devicePixelRatio){mm.width=126*devicePixelRatio;mm.height=102*devicePixelRatio}mx.fillStyle='#253a29';mx.fillRect(0,0,126,102);mx.fillStyle='#d4b16a';mx.fillRect(60,48,6,6);mx.fillStyle='#b35b43';monsters.forEach(m=>{let a=63+(m.x-px)/15,b=51+(m.y-py)/15;if(a>2&&a<124&&b>2&&b<100)mx.fillRect(a,b,2,2)});
requestAnimationFrame(draw)}
let t0=0;function loop(t){let dt=Math.min(.04,(t-t0)/1000||0);t0=t;px+=move.x*170*dt;py+=move.y*170*dt;if(attackOn&&t-last>900){last=t;let m=monsters.find(m=>Math.hypot(m.x-px,m.y-py)<70);if(m){m.hp-=18;if(m.hp<=0){monsters=monsters.filter(q=>q!==m);kills++;gold+=12;xp+=25;if(kills%5===0){level++;xp=0;hp=100;toast('Nível '+level+' alcançado!')}if(monsters.length<8)for(let i=0;i<5;i++)monsters.push({x:px+rnd(-500,500),y:py+rnd(-400,400),hp:35,max:35,kind:i%3});document.getElementById('kills').textContent='Criaturas: '+Math.min(kills,5)+' / 5';document.getElementById('gold').textContent=gold;document.getElementById('level').textContent=level;document.getElementById('xp').style.width=(xp/100*100)+'%';if(kills===5)toast('Missão concluída! +100 ouro');}}}requestAnimationFrame(loop)}requestAnimationFrame(loop);draw();
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
document.getElementById('attack').onpointerdown=()=>attackOn=true;document.getElementById('attack').onpointerup=()=>attackOn=false;document.getElementById('attack').onpointerleave=()=>attackOn=false;
document.getElementById('potion').onclick=()=>{hp=Math.min(100,hp+35);document.getElementById('hp').style.width=hp+'%';document.getElementById('hptext').textContent=hp+' / 100 HP';toast('Poção utilizada')};
let joy=document.getElementById('joystick'),stick=document.getElementById('stick');function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),k=Math.min(1,42/(d||1));move={x:dx*k/42,y:dy*k/42};stick.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=e=>{if(e.buttons)joyMove(e)};joy.onpointerup=()=>{move={x:0,y:0};stick.style.transform=''};
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')move.y=-1;if(e.key==='s'||e.key==='ArrowDown')move.y=1;if(e.key==='a'||e.key==='ArrowLeft')move.x=-1;if(e.key==='d'||e.key==='ArrowRight')move.x=1;if(e.key===' ')attackOn=true;if(e.key.toLowerCase()==='b')openMenu()});addEventListener('keyup',e=>{if(e.key===' ' )attackOn=false;if(['w','s','a','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))move={x:0,y:0}});
function openMenu(){document.getElementById('menu').style.display='flex';document.getElementById('menutitle').textContent='Inventário';document.getElementById('menucontent').innerHTML='<div class="grid">'+['🗡️<small>Espada antiga</small>','🛡️<small>Escudo de ferro</small>','🧪<small>Poção de vida</small>','💎<small>Gema misteriosa</small>','🪙<small>'+gold+' ouro</small>','📜<small>Missão da floresta</small>','🪶<small>Amuleto</small>','🥾<small>Botas de couro</small>'].map(x=>'<div class="item">'+x+'</div>').join('')+'</div><p class="small">Equipamentos e itens coletados em sua jornada.</p><button class="btn" id="shop">Abrir loja · 50 ouro</button>';document.getElementById('shop').onclick=()=>{if(gold>=50){gold-=50;document.getElementById('gold').textContent=gold;toast('Poção reforçada comprada')}else toast('Ouro insuficiente')}}document.getElementById('bag').onclick=openMenu;document.getElementById('close').onclick=()=>document.getElementById('menu').style.display='none';document.getElementById('menu').onclick=e=>{if(e.target.id==='menu')e.currentTarget.style.display='none'};
})();
</script></body></html>
