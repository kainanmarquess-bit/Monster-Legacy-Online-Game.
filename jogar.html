 if(kind!=='hero'){ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#0a1512';ctx.strokeText(a.name||kind,x,y-30);ctx.fillStyle='#fff0c7';ctx.fillText(a.name||kind,x,y-30);if(a.hp<a.max){px(x-13,y-26,26,4,'#261b18');px(x-12,y-25,24*a.hp/a.max,2,'#d84b40')}}
}
function worldDraw(){let camX=hero.x-vw/2,camY=hero.y-vh/2;ctx.clearRect(0,0,vw,vh);ctx.save();ctx.translate(-camX,-camY);
 let x0=clamp(Math.floor(camX/TILE)-1,0,MW-1),x1=clamp(Math.ceil((camX+vw)/TILE)+1,0,MW-1),y0=clamp(Math.floor(camY/TILE)-1,0,MH-1),y1=clamp(Math.ceil((camY+vh)/TILE)+1,0,MH-1);
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)drawGround(x,y,worldMap[y][x]);
 // river banks and bridge
 for(let x=49;x<53;x++){for(let y=3;y<16;y++){ctx.fillStyle='#7c6847';ctx.fillRect(x*TILE,y*TILE,32,4);ctx.fillRect(x*TILE,(y+1)*TILE-4,32,4)}}
 ctx.fillStyle='#805c39';ctx.fillRect(48*TILE,9*TILE,6*TILE,20);for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#b17b49':'#98683e';ctx.fillRect(48*TILE+i*32,9*TILE,30,20)}
 drawHouse(27,13);for(const p of trees)drawTree(p[0],p[1]);for(const p of rocks)drawRock(p[0],p[1]);
 // decorative grass tufts
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(worldMap[y][x]===0&&(x*7+y*13)%11===0){ctx.fillStyle='#9db45d';ctx.fillRect(x*TILE+8,y*TILE+19,2,5);ctx.fillRect(x*TILE+12,y*TILE+17,2,7)}
 monsters.filter(m=>m.alive).sort((a,b)=>a.y-b.y).forEach(m=>drawActor(m,m.type));
 drawActor(hero,'hero');
 for(const e of effects){ctx.globalAlpha=clamp(e.life/220,0,1);ctx.strokeStyle=e.color;ctx.lineWidth=e.width;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-e.life/300),e.a-.8,e.a+.8);ctx.stroke();ctx.globalAlpha=1}
 for(const f of floaters){ctx.globalAlpha=clamp(f.life/800,0,1);ctx.fillStyle=f.color;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#101510';ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1}
 ctx.restore()}
function drawMini(){if(!mctx)return;mctx.clearRect(0,0,220,150);mctx.fillStyle='#18382c';mctx.fillRect(0,0,220,150);for(let y=0;y<MH;y+=2)for(let x=0;x<MW;x+=2){let t=worldMap[y][x];mctx.fillStyle=t===1?'#98865b':t===2?'#31789a':t===4?'#1b3826':'#4d7542';mctx.fillRect(x/MW*220,y/MH*150,7,6)}mctx.fillStyle='#f5d26e';mctx.fillRect(hero.x/(MW*TILE)*220-2,hero.y/(MH*TILE)*150-2,5,5);mctx.fillStyle='#d75a50';for(const m of monsters)if(m.alive)mctx.fillRect(m.x/(MW*TILE)*220-1,m.y/(MH*TILE)*150-1,3,3)}
function showMessage(s){let e=document.getElementById('message');e.textContent=s;e.style.opacity=1;clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>e.style.opacity=0,1000)}
function hud(){document.getElementById('hpBar').style.width=hero.hp+'%';document.getElementById('mpBar').style.width=hero.mp+'%';document.getElementById('xpBar').style.width=(hero.xp%100)+'%';document.getElementById('level').textContent='NV. '+hero.level;document.getElementById('gold').textContent='🪙 '+hero.gold.toLocaleString('pt-BR');}
function addHit(x,y,text,color){floaters.push({x,y,text,color,life:850})}
function nearest(){let arr=monsters.filter(m=>m.alive);arr.sort((a,b)=>Math.hypot(a.x-hero.x,a.y-hero.y)-Math.hypot(b.x-hero.x,b.y-hero.y));return arr[0]||null}
function attack(){if(hero.attack>0)return;let m=nearest();if(!m){showMessage('Não há criaturas por perto');return}let dx=m.x-hero.x,dy=m.y-hero.y,dist=Math.hypot(dx,dy);if(dist>68){showMessage('Aproxime-se do alvo');return}hero.dir=direction(dx,dy);hero.attackDir=hero.dir;hero.attack=1;setTimeout(()=>{if(!m.alive)return;let dmg=18+Math.floor(rnd()*8);m.hp-=dmg;m.hit=160;effects.push({x:(hero.x+m.x)/2,y:(hero.y+m.y)/2,r:22,life:240,a:Math.atan2(dy,dx),color:'#dffaff',width:4});addHit(m.x,m.y-24,'-'+dmg,'#ffe48a');if(m.hp<=0){m.alive=false;for(let k=0;k<8;k++){let a=k*Math.PI/4;effects.push({x:m.x+Math.cos(a)*9,y:m.y+Math.sin(a)*9,r:24,life:360,a,color:'#f4d27a',width:2})}hero.xp+=18;hero.gold+=5+Math.floor(rnd()*12);addHit(m.x,m.y-40,'+18 XP','#9df0a5');showMessage(m.type+' derrotado!');if(hero.xp>=100){hero.xp-=100;hero.level++;hero.hp=100;showMessage('NÍVEL '+hero.level+'!')}}hud()},260);setTimeout(()=>hero.attack=0,520)}
function direction(dx,dy){let a=Math.atan2(dy,dx);return (Math.round(a/(Math.PI/4))+8)%8}
let auto=false,autoTimer=0;
function update(dt){let vx=joy.x,vy=joy.y;const mag=Math.hypot(vx,vy);if(mag>.12){vx/=Math.max(1,mag);vy/=Math.max(1,mag);hero.dir=direction(vx,vy);let sp=145*dt/1000;let nx=hero.x+vx*sp,ny=hero.y+vy*sp;if(!solid(nx-8,hero.y+10)&&!solid(nx+8,hero.y+10))hero.x=nx;if(!solid(hero.x,ny+10))hero.y=ny;hero.walk+=dt/1000*9}else hero.walk=0;
 if(hero.attack>0)hero.attack=Math.max(0,hero.attack-dt/520);
 if(auto){autoTimer-=dt;let m=nearest();if(m){let dx=m.x-hero.x,dy=m.y-hero.y,d=Math.hypot(dx,dy);if(d>52){joy.x=dx/d;joy.y=dy/d}else{joy.x=0;joy.y=0;if(autoTimer<=0){attack();autoTimer=850}}}}
 for(const m of monsters){if(!m.alive)continue;m.walk+=dt/1000*4;if(m.hit>0)m.hit-=dt;if(m.attack>0)m.attack=Math.max(0,m.attack-dt/500);let dx=hero.x-m.x,dy=hero.y-m.y,d=Math.hypot(dx,dy);m.think-=dt/1000;if(d<175&&d>43&&m.think<=0){let nx=m.x+dx/d*22,ny=m.y+dy/d*22;if(!solid(nx,ny)){m.x=nx;m.y=ny}m.dir=direction(dx,dy);m.think=.5+rnd()*.7}else if(d<=43&&m.think<=0){m.attack=1;hero.hp=Math.max(0,hero.hp-3);hero.hit=120;m.think=1.2;addHit(hero.x,hero.y-25,'-3','#ff8a7a');if(hero.hp===0){hero.hp=100;hero.x=35*TILE;hero.y=30*TILE;showMessage('Você retornou à cidade');}hud()}}
 for(let i=effects.length-1;i>=0;i--){effects[i].life-=dt;if(effects[i].life<=0)effects.splice(i,1)}
 for(let i=floaters.length-1;i>=0;i--){floaters[i].life-=dt;floaters[i].y-=dt*.025;if(floaters[i].life<=0)floaters.splice(i,1)}
 if(hero.hit>0)hero.hit-=dt;
}
const joy={x:0,y:0};let joyPointer=null;
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');
function joySet(e){let r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
joyEl.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joyEl.setPointerCapture(joyPointer);joySet(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joySet(e)});function joyEnd(e){if(e.pointerId===joyPointer){joyPointer=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
document.getElementById('attack').onclick=attack;document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent='AUTO: '+(auto?'ON':'OFF');document.getElementById('auto').classList.toggle('active',auto);if(!auto)joy.x=joy.y=0};
document.getElementById('menu').onclick=()=>document.getElementById('panel').classList.add('open');document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('open');document.getElementById('heal').onclick=()=>{hero.hp=Math.min(100,hero.hp+35);hero.mp=Math.min(100,hero.mp+20);hud();showMessage('Poção utilizada')};
document.getElementById('panelStats').textContent='Nível '+hero.level+' • '+hero.gold+' moedas';
window.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();attack()}if(e.key==='Shift'){auto=!auto;document.getElementById('auto').textContent='AUTO: '+(auto?'ON':'OFF')}});
let keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function loop(ts){if(!last)last=ts;let dt=Math.min(40,ts-last);last=ts;now=ts;if(!joyPointer&&!auto){joy.x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);joy.y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)}update(dt);worldDraw();if(Math.floor(ts/250)%2===0)drawMini();requestAnimationFrame(loop)}
hud();requestAnimationFrame(loop);
})();
</script></body></html>
